<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0a10'/%3E%3Cpath d='M3 3h10v10H3z' fill='none' stroke='%23c9a24a' stroke-width='1.4'/%3E%3Cpath d='M3 8h4v5' fill='none' stroke='%23c9a24a' stroke-width='1.4'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>Labirynt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Oswald:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styl.css?v=1793201601">
<script>
/* Łapacz awarii: bez tego błąd w module daje tylko czarny ekran
   i nie wiadomo, czy gra się zawiesiła, czy jeszcze wczytuje. */
(function () {
  function pokaz(co) {
    var el = document.getElementById('awaria');
    if (!el) return;
    el.style.cssText = 'position:fixed;inset:0;z-index:90;padding:26px;overflow:auto;' +
      'background:#0b0a10;color:#e8e2d6;font:13px/1.6 ui-monospace,monospace;white-space:pre-wrap';
    el.textContent = 'Gra się nie uruchomiła.\n\n' + co +
      '\n\nSpróbuj odświeżyć z pominięciem pamięci podręcznej.';
  }
  addEventListener('error', function (e) {
    var cel = e.target && e.target.src ? ('\nzasób: ' + e.target.src) : '';
    var szczegol = e.error && e.error.stack ? ('\n' + e.error.stack) : '';
    pokaz((e.message || 'błąd wczytywania') +
          '\n' + (e.filename || '-') + ':' + (e.lineno || '-') + cel + szczegol);
  }, true);
  addEventListener('unhandledrejection', function (e) {
    pokaz('Nieobsłużony błąd: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
})();
</script>
</head>
<body>

<div id="awaria"></div>
<canvas id="plotno"></canvas>

<div id="winieta"></div>
<div id="blysk"></div>

<div id="cel"><div class="etykieta">Zadanie</div><div class="tresc"></div></div>

<div id="mapkaRamka"><canvas id="mapka" width="192" height="192"></canvas></div>

<div id="przyciskiHud">
  <button class="ikona" id="ikonaEkw" aria-label="Ekwipunek">
    <svg viewBox="0 0 24 24"><path d="M5 9h14l1 11H4L5 9Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/><path d="M8.5 13h7"/></svg>
    <span class="licznik" data-puste="1"></span>
  </button>
  <button class="ikona" id="ikonaDzwiek" aria-label="Dźwięk">
    <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4v-5Z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18 7a7.4 7.4 0 0 1 0 10"/></svg>
  </button>
</div>

<div id="podpowiedz"></div>
<div id="szept"></div>
<div id="dymek"></div>
<div id="drazek"><div id="galka"></div></div>

<div id="panelCien"></div>
<div id="panel">
  <div class="uchwyt"></div>
  <div class="naglowek"><h2></h2><button class="zamknij" id="panelZamknij">Zamknij</button></div>
  <div class="zawartosc"></div>
</div>

<div id="minigra"></div>
<div id="kurtyna"></div>
<div class="nakladka" id="ekran"></div>

<script type="module">
import { Gra, CELL } from './gra.js?v=1793201601';
import { UI } from './ui.js?v=1793201601';
import { Dzwiek } from './dzwiek.js?v=1793201601';
import { Swiat } from './swiat.js?v=1793201601';
import { Rekwizyty } from './rekwizyty.js?v=1793201601';
import { ratujFenka, jumpscare, kielbasa } from './minigry.js?v=1793201601';

const gra = new Gra(document.getElementById('plotno'));
const dzwiek = new Dzwiek();
gra.dzwiek = dzwiek;
gra.zbuduj(22, 22, 20261028);
gra.rozmiar();

/* ─────────────── rysowanie mapy (ta sama dla małej i dużej) ─────────────── */
function rysujMape(ctx, bok, { etykiety = false } = {}) {
  const lab = gra.lab, n = Math.max(lab.w, lab.h), k = bok / n;
  ctx.clearRect(0, 0, bok, bok);

  for (let y = 0; y < lab.h; y++) for (let x = 0; x < lab.w; x++) {
    if (!gra.odwiedzone[y * lab.w + x]) continue;
    ctx.fillStyle = 'rgba(201,162,74,.14)';
    ctx.fillRect(x * k, y * k, k, k);
    ctx.strokeStyle = 'rgba(201,162,74,.6)';
    ctx.lineWidth = Math.max(1, k * 0.085);
    ctx.beginPath();
    if (lab.ma(x, y, 1)) { ctx.moveTo(x * k,     y * k);     ctx.lineTo(x * k + k, y * k); }
    if (lab.ma(x, y, 4)) { ctx.moveTo(x * k,     y * k + k); ctx.lineTo(x * k + k, y * k + k); }
    if (lab.ma(x, y, 8)) { ctx.moveTo(x * k,     y * k);     ctx.lineTo(x * k,     y * k + k); }
    if (lab.ma(x, y, 2)) { ctx.moveTo(x * k + k, y * k);     ctx.lineTo(x * k + k, y * k + k); }
    ctx.stroke();
  }

  // znaczniki rzeczy, o których gracz już wie
  for (const z of gra.znaczniki || []) {
    if (!gra.odwiedzone[z.y * lab.w + z.x]) continue;
    ctx.fillStyle = z.kolor || '#e4c47a';
    ctx.beginPath();
    ctx.arc(z.x * k + k / 2, z.y * k + k / 2, Math.max(2, k * 0.18), 0, 7);
    ctx.fill();
  }

  const px = gra.pozycja.x / CELL * k, py = gra.pozycja.z / CELL * k;
  const r = Math.max(4.5, k * 0.34);
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(-gra.obrot.y);
  ctx.fillStyle = '#f2ead8';
  ctx.beginPath();
  ctx.moveTo(0, -r * 1.25); ctx.lineTo(r * 0.95, r * 1.08);
  ctx.lineTo(0, r * 0.5);   ctx.lineTo(-r * 0.95, r * 1.08);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  if (etykiety) {
    const ile = gra.odwiedzone.reduce((a, b) => a + b, 0);
    ctx.fillStyle = 'rgba(201,162,74,.75)';
    ctx.font = '600 ' + Math.round(bok * 0.028) + 'px Oswald, sans-serif';
    ctx.fillText('ZWIEDZONE ' + Math.round(ile / (lab.w * lab.h) * 100) + '%', 4, bok - 5);
  }
}

const mg = document.getElementById('mapka').getContext('2d');
let ostatniRysunek = 0, duzyCtx = null;
gra.mapka = () => {
  const teraz = performance.now();
  if (teraz - ostatniRysunek < 90) return;
  ostatniRysunek = teraz;
  rysujMape(mg, 192);
  if (duzyCtx) rysujMape(duzyCtx, 840, { etykiety: true });
};

/* ─────────────── panel: duża mapa i ekwipunek ─────────────── */
function zamknij() {
  duzyCtx = null;
  gra.zamrozony = false;
  gra.zablokowaneWejscie = false;
  UI.zamknijPanel();
  dzwiek.klik();
}
document.getElementById('panelZamknij').addEventListener('click', zamknij);
document.getElementById('panelCien').addEventListener('click', zamknij);

function wstrzymaj() {
  gra.zamrozony = true;
  gra.zablokowaneWejscie = true;
  gra.sterowanie.przod = gra.sterowanie.bok = 0;
  document.getElementById('drazek').classList.remove('widoczny');
  dzwiek.klik();
}

document.getElementById('mapkaRamka').addEventListener('click', () => {
  if (UI.panelOtwarty()) return;
  wstrzymaj();
  const ciało = UI.otworzPanel('Mapa', '<canvas id="duzaMapa" width="840" height="840"></canvas>');
  duzyCtx = ciało.querySelector('#duzaMapa').getContext('2d');
  rysujMape(duzyCtx, 840, { etykiety: true });
});

function otworzEkwipunek() {
  if (UI.panelOtwarty()) return;
  wstrzymaj();
  UI.otworzPanel('Ekwipunek', UI.rysujEkwipunek(gra.ekwipunek));
}
document.getElementById('ikonaEkw').addEventListener('click', otworzEkwipunek);

/* dodawanie przedmiotu: odświeża licznik i gra dźwięk */
gra.dodajPrzedmiot = (przedmiot) => {
  gra.ekwipunek.push(przedmiot);
  UI.licznik('ikonaEkw', gra.ekwipunek.length);
  dzwiek.zdobycz();
};

/* ─────────────── przełącznik dźwięku ─────────────── */
const ikonaDzwiek = document.getElementById('ikonaDzwiek');
ikonaDzwiek.addEventListener('click', () => {
  const wl = dzwiek.przelacz();
  ikonaDzwiek.classList.toggle('wyciszony', !wl);
  if (wl) dzwiek.klik();
});

/* gra w tle nie ma prawa grać dalej */
document.addEventListener('visibilitychange', () => {
  if (!dzwiek.gotowy) return;
  if (document.hidden) dzwiek.ctx.suspend();
  else if (dzwiek.wlaczony) dzwiek.ctx.resume();
});

/* ─────────────── wejście do gry ─────────────── */
UI.hud(false);
const start = UI.pokazNakladke('ekran', {
  znacznik: 'Dwudziesty ósmy października',
  tytul: 'Labirynt',
  akapity: [
    'Michał gdzieś tu jest. Nie wiem, jak daleko.',
    'Znajdź go i wyprowadź oboje na zewnątrz.'
  ],
  przycisk: 'Wchodzę',
  wskazowka: '<b>Lewy kciuk</b> chodzi<br><b>Prawa strona</b> rozgląda<br>Najlepiej w słuchawkach'
});

/* Gdyby dźwięk nie ruszył (zdarza się w webview i przy włączonej ciszy),
   nie zostawiamy gracza w niepewności: pokazujemy pasek i próbujemy
   ponownie przy każdym kolejnym dotknięciu ekranu. */
async function pilnujDzwieku() {
  if (dzwiek.gotowy && dzwiek.ctx.state === 'running') return true;
  UI.podpowiedz('Stuknij, żeby włączyć dźwięk');
  const ponow = async () => {
    await dzwiek.odblokuj();
    if (dzwiek.ctx && dzwiek.ctx.state === 'running') {
      dzwiek.start();
      UI.podpowiedz('');
      removeEventListener('pointerdown', ponow);
    }
  };
  addEventListener('pointerdown', ponow);
  return false;
}

/* Wejście do gry nie może zależeć od niczego, co wolno zawieść:
   dźwięk bywa blokowany przez przeglądarkę, a modele i zdjęcia mogą się
   nie dociągnąć. Każdy taki krok jest osobno zabezpieczony, a prawdziwy
   błąd trafia na ekran zamiast gasnąć w pustce. */
function opisBledu(e) {
  if (!e) return 'nieznany błąd';
  return (e.message || String(e)) + (e.stack ? '\n' + e.stack : '');
}

start.addEventListener('click', async () => {
  try {
    try {
      await dzwiek.odblokuj();
      dzwiek.start();
      pilnujDzwieku();
    } catch (e) {
      console.warn('dźwięk:', e);
      UI.podpowiedz('Dźwięk niedostępny');
      setTimeout(() => UI.podpowiedz(''), 2500);
    }

    await UI.zaslon(420);
    UI.ukryjNakladke('ekran');
    UI.hud(true);
    UI.cel('Znajdź drogę w głąb');

    try {
      await swiat.zaladuj();
    } catch (e) {
      throw new Error('nie wczytano postaci: ' + opisBledu(e));
    }

    const poprzedni = gra.naTik;
    gra.naTik = (dt) => { poprzedni(dt); pilnujWyjscia(); pilnujWyjsciaZCeli(); };
    gra.start();
    await celaStartowa();
  } catch (e) {
    const el = document.getElementById('awaria');
    el.style.cssText = 'position:fixed;inset:0;z-index:90;padding:26px;overflow:auto;' +
      'background:#0b0a10;color:#e8e2d6;font:13px/1.6 ui-monospace,monospace;white-space:pre-wrap';
    el.textContent = 'Gra się nie uruchomiła.\n\n' + opisBledu(e) +
      '\n\nPokaż ten ekran Michałowi.';
  }
}, { once: true });

/* ─────────────── świat: postacie, pościg, cele ─────────────── */
const swiat = new Swiat(gra, dzwiek, UI);
const rekwizyty = new Rekwizyty(gra);
gra.naTik = (dt) => { swiat.tik(dt); rekwizyty.tik(gra.czas); };
gra.naStukniecie = () => {
  if (czekaNaWyjscie) { doLabiryntu(); return true; }
  return swiat.uzyj();
};

const KWESTIE = {
  programista: [
    'O, hej. Idę szukać myszki do kompa.',
    'Powodzenia w szukaniu Fenka.',
    'Remcioszek poszedł tamtędy. Chyba. Nie patrzyłem.',
    'Nie, serio, gdzie jest ta myszka.'
  ]
};
let ktoraKwestia = 0;

swiat.naZdarzenie = async (co, szczegol) => {
  if (co === 'smok-postawiony') {
    rekwizyty.wnetrze('modele/szczerbatek.glb', {
      srodek: szczegol.srodek, szerokosc: 1.05
    }).then(r => { szczegol.model = r.obiekt; })
      .catch(e => console.warn('szczerbatek:', e.message));
    return;
  }
  if (co === 'smok') {
    swiat.powiedz(swiat.fenek && swiat.fenekZabrany ? swiat.fenek : { pozycja: gra.pozycja, wysokosc: 1.2 },
      '', 'Szczerbatek idzie z Tobą.', 2400);
    return;
  }
  if (co === 'stoisko-postawione') {
    // model dostawiany po rozstawieniu, bo wczytuje się w tle
    rekwizyty.wnetrze('modele/stragan.glb', {
      srodek: szczegol.srodek, szerokosc: 3.1, obrot: szczegol.obrot || 0
    }).then(r => { szczegol.model = r.obiekt; })
      .catch(e => console.warn('stragan:', e.message));
    return;
  }
  if (co === 'stoisko') {
    await przyStoisku();
    return;
  }
  if (co === 'programista') {
    const t = KWESTIE.programista[ktoraKwestia % KWESTIE.programista.length];
    ktoraKwestia++;
    dzwiek.klik();
    swiat.powiedz(swiat.programista, 'Programista', t, 3400);
    return;
  }
  if (co === 'fenek') {
    swiat.powiedz(swiat.fenek, 'Fenek', 'Wiedziałem, że przyjdziesz. Trzymaj się blisko.', 3600);
    return;
  }
  if (co === 'zauwazyl') {
    UI.szept('On cię zobaczył.', 1500);
    return;
  }
  if (co === 'pajak') {
    await spotkanieZPajakiem(szczegol);
    return;
  }
  if (co === 'zamkniete') {
    UI.szept('Nie wyjdę bez niego.', 1800);
    return;
  }
  if (co === 'drzwi') {
    UI.cel('Wyjdźcie');
    return;
  }
  if (co === 'zlapana') {
    await smierc();
  }
};

/* ─────────────── stoisko z kiełbasą ─────────────── */
let wTrakcieStoiska = false;
async function przyStoisku() {
  if (wTrakcieStoiska) return;
  wTrakcieStoiska = true;
  UI.podpowiedz('');
  gra.zamrozony = true;
  dzwiek.napiecie(0);
  await UI.szept('Stoisko blokuje przejście. Ktoś musi się tym zająć.', 2000);

  let wygrana = false;
  while (!wygrana) {
    wygrana = await kielbasa(dzwiek);
    if (!wygrana) await UI.szept('Jeszcze raz.', 1400);
  }
  swiat.rozwiazStoisko();
  await UI.szept('Przejście wolne. Fenek by to docenił.', 2100);
  gra.zamrozony = false;
  wTrakcieStoiska = false;
}

/* ─────────────── cela startowa ─────────────── */
let wCeli = false, celaGotowa = false;
async function celaStartowa() {
  wCeli = true; celaGotowa = false;
  gra.zamrozony = true;
  swiat.stan = 'cela';
  UI.hud(false);
  const pokoj = gra.zbudujPokoj(2, 'loch', 3);
  const wnetrzeSali = await rekwizyty.wnetrze('modele/sala.glb', {
    srodek: { x: pokoj.srodek.x, z: 2.6 },
    szerokosc: pokoj.bok - 0.3
  }).catch(e => { console.warn('sala:', e.message); return null; });

  // drzwi na tylnej ścianie: wyjście ma być widoczne, a nie domyślne
  rekwizyty.wnetrze('modele/drzwi.glb', {
    srodek: { x: pokoj.srodek.x, z: pokoj.glebokosc - 0.45 },
    szerokosc: 2.3, obrot: Math.PI
  }).catch(e => console.warn('drzwi:', e.message));

  // gracz stoi tuż przed otwartą stroną dioramy i patrzy w jej wnętrze;
  // wyjście zostaje za plecami, w głębi pomieszczenia
  const glebSali = wnetrzeSali ? wnetrzeSali.rozmiar.z : 4.4;
  gra.pozycja.set(pokoj.srodek.x, 1.62, 2.6 + glebSali / 2 + 1.6);
  gra.obrot.y = 0; gra.obrot.x = -0.02;
  gra.zamrozony = false;

  await UI.odsloń(900);
  // sterowanie oddajemy od razu: szepty lecą w tle, a nie zamiast gry
  UI.cel('Wyjdź z celi');
  UI.hud(true);
  celaGotowa = true;
  window.__celaGotowa = true;
  (async () => {
    await UI.szept('Obudziłaś się w celi.', 2200);
    if (wCeli) await UI.szept('Fenka tu nie ma. Wyjście jest za tobą.', 2400);
  })();
}

/* wyjście z celi: tyłem, przez mur za plecami */
function pilnujWyjsciaZCeli() {
  if (!wCeli || !celaGotowa || gra.zamrozony) return;
  const g = gra.lab.h * 4;
  if (gra.pozycja.z > g - 2.2) {
    UI.podpowiedz('Wyjdź do korytarza');
    czekaNaWyjscie = true;
  } else { UI.podpowiedz(''); czekaNaWyjscie = false; }
}
let czekaNaWyjscie = false;

async function doLabiryntu() {
  wCeli = false; celaGotowa = false; czekaNaWyjscie = false;
  window.__celaGotowa = false;
  gra.zamrozony = true;
  UI.podpowiedz('');
  dzwiek.otwarcie();
  await UI.zaslon(700);
  rekwizyty.usun();
  gra.zbuduj(22, 22, 20261028);
  swiat.rozpocznij();
  rekwizyty.pochodnieNaScianach(16).catch(e => console.warn('pochodnie:', e.message));
  rekwizyty.drobiazgi(14);
  UI.hud(true);
  gra.zamrozony = false;
  await UI.odsloń(800);
  await UI.szept('Za tobą zamknęły się drzwi.', 2300);
}

/* ─────────────── pająk: najpierw skok, potem ratowanie Fenka ─────────────── */
let wTrakciePajaka = false;
async function spotkanieZPajakiem(pajak) {
  if (wTrakciePajaka || wTrakcieSmierci) return;
  wTrakciePajaka = true;
  UI.podpowiedz('');
  if (pajak) await jumpscare(gra, pajak, dzwiek, 850);
  gra.zamrozony = true;
  dzwiek.napiecie(0);

  let wygrana = false;
  while (!wygrana) {
    wygrana = await ratujFenka(dzwiek);
    if (!wygrana) {
      await UI.szept('Dopadły go. Jeszcze raz.', 1700);
    }
  }
  await UI.szept('Strząsnęłaś je wszystkie.', 1900);
  gra.zamrozony = false;
  wTrakciePajaka = false;
}

/* ─────────────── śmierć i restart ─────────────── */
let wTrakcieSmierci = false;
async function smierc() {
  if (wTrakcieSmierci) return;
  wTrakcieSmierci = true;
  gra.zamrozony = true;
  dzwiek.zlapanie();
  dzwiek.napiecie(0);
  UI.uderzenie();
  UI.podpowiedz('');
  swiat.zgony++;
  swiat.zapisz();
  await new Promise(r => setTimeout(r, 900));
  await UI.zaslon(600);
  UI.hud(false);
  const znow = UI.pokazNakladke('ekran', {
    znacznik: 'Remcioszek cię dorwał',
    tytul: 'Od początku',
    akapity: ['Labirynt jest ten sam. Remcioszek pójdzie inaczej.'],
    przycisk: 'Jeszcze raz'
  });
  await UI.odsloń(10);
  znow.addEventListener('click', async () => {
    dzwiek.klik();
    await UI.zaslon(400);
    UI.ukryjNakladke('ekran');
    gra.zbuduj(22, 22, 20261028);
    rekwizyty.usun();
    swiat.rozpocznij();
    rekwizyty.pochodnieNaScianach(16).catch(e => console.warn('pochodnie:', e.message));
    rekwizyty.drobiazgi(14);
    UI.dymek(null, '');
    UI.hud(true);
    gra.zamrozony = false;
    wTrakcieSmierci = false;
    await UI.odsloń(600);
  }, { once: true });
}

/* ─────────────── wyjście do białego pokoju ─────────────── */
let wyszli = false;
const pilnujWyjscia = () => {
  if (wyszli || !gra.wyjscieOtwarte || !gra.wyjscie) return;
  const w = gra.wyjscie, pw = gra.punktWyjscia;
  const poza = { 1: gra.pozycja.z < pw.z - 1.6, 2: gra.pozycja.x > pw.x + 1.6,
                 4: gra.pozycja.z > pw.z + 1.6, 8: gra.pozycja.x < pw.x - 1.6 }[w.kier];
  if (poza) { wyszli = true; bialyPokoj(); }
};

async function bialyPokoj() {
  gra.zamrozony = true;
  dzwiek.napiecie(0);
  dzwiek.cisza(1400);
  await UI.zaslon(900);
  UI.hud(false);
  UI.podpowiedz('');
  swiat.usunPostacie();
  rekwizyty.usun();
  const pokoj = gra.zbudujBialyPokoj(5);
  gra.zamrozony = false;

  // mieszkanie jako sceneria końcowa, a w nim oboje
  await rekwizyty.wnetrze('modele/mieszkanie.glb',
    { x: 0, y: 0, bok: 5, wysokosc: 4.4 }).catch(e => console.warn('mieszkanie:', e.message));
  await swiat.scenaKoncowa(pokoj.bok);

  await UI.odsloń(1400);
  await UI.szept('I tyle. Wyszliście.', 2600);
  await UI.szept('Dalszy ciąg za miesiąc.', 2400);
  UI.pokazNakladke('ekran', {
    znacznik: 'Koniec',
    tytul: 'Jesteście w domu',
    akapity: ['Ciąg dalszy nastąpi.']
  });
}

window.gra = gra;
window.swiat = swiat;
window.rekwizyty = rekwizyty;
window.UI = UI;
window.dzwiek = dzwiek;
</script>
</body>
</html>
